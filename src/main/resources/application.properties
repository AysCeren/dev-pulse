spring.application.name=devpulse

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
# Redis is not used until the caching phase, so it must not fail the health check.
management.health.redis.enabled=false

# ANTHROPIC_API_KEY binds to anthropic.api.key, and startup fails if it is missing.
anthropic.api.url=https://api.anthropic.com
anthropic.api.version=2026-10-21
anthropic.api.model=claude-opus-5-5
anthropic.api.max-tokens=2048
anthropic.api.effort=low
anthropic.api.connect-timeout=5s
anthropic.api.read-timeout=60s
